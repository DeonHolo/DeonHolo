name: Refresh profile graphics

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/profile.py'
      - 'scripts/dungeon.py'
      - 'scripts/dungeon-requirements.txt'
      - 'scripts/dungeon-tracks/**'
      - 'profile.json'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'DeonHolo/DeonHolo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up the dungeon renderer
        run: |
          python3 -m venv "$RUNNER_TEMP/profile-renderer"
          "$RUNNER_TEMP/profile-renderer/bin/pip" install -r scripts/dungeon-requirements.txt
      - name: Refresh public GitHub graphics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/profile-renderer/bin/python" scripts/profile.py'
      - name: Save updated graphics
        run: |
          git add assets/
          if git diff --cached --quiet; then
            echo 'Graphics are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public GitHub profile graphics [skip ci]'
          git push
