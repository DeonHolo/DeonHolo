<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" aria-labelledby="title desc" role="img" viewBox="0 0 1000 310"><title id="title">deon holo — i like modding stuff</title><desc id="desc">Agentic coding, Spec-Driven Development, game and software mods, and useful little tools.</desc><style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Menlo,monospace}</style><rect width="1000" height="310" fill="#f3f7ee" rx="14"/><text x="38" y="36" fill="#446821" class="mono" font-size="20" font-weight="700">dh_</text><text x="94" y="35" fill="#586352" class="mono" font-size="12" letter-spacing="1.3">DEONHOLO / PERSONAL WORKSPACE</text><path stroke="#d2dccb" d="M38 54H962"/><text x="38" y="128" fill="#242b26" font-size="67" font-weight="700" letter-spacing="-3">i like</text><text x="38" y="205" fill="#446821" font-size="70" font-weight="700" letter-spacing="-3">modding stuff.</text><text x="40" y="265" fill="#586352" font-size="17">games. software. the way things work.</text><rect width="298" height="167" x="663" y="83" fill="none" stroke="#d2dccb" rx="9"/><text x="682" y="111" fill="#586352" class="mono" font-size="12">~/deon</text><path stroke="#d2dccb" d="M663 126H961"/><text x="682" y="160" fill="#446821" class="mono" font-size="18">&gt; edit the rules</text><text x="682" y="189" fill="#242b26" class="mono" font-size="13">spec / build / test / tweak</text><text x="682" y="221" fill="#586352" class="mono" font-size="11">there is probably a mod for that_</text><text x="961" y="287" fill="#586352" class="mono" font-size="11" letter-spacing="1" text-anchor="end">ALWAYS TINKERING</text></svg>